[project]
name = "medleghub-sql-runner"
version = "0.1.0"
description = "MedlegHub — сурагчийн MySQL кодыг тусгаарлагдсан сервер дээр ажиллуулах үйлчилгээ"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["sqlrunner", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["sqlrunner", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Хаагдаагүй холболт, дуусаагүй unbuffered үр дүн production-ы логийг бохирдуулна.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
