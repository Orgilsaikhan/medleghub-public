[project]
name = "medleghub-extractor"
version = "0.1.0"
description = "MedlegHub — хэрэглэгчийн PDF, PPTX, DOCX файлаас текст задлах тусгаарлагдсан үйлчилгээ"
# `asyncio.timeout` шаарддаг.
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["extractor", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["extractor", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Хаагдаагүй дэд процесс, pipe production-ы логийг бохирдуулна.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
